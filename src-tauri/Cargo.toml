[package]
name = "desktop-ai-pet"
version = "0.1.0"
description = "Desktop AI Pet - a little creature living on your desktop"
edition = "2021"
default-run = "desktop-ai-pet"

[[bin]]
name = "desktop-ai-pet"
path = "src/main.rs"

# MCP stdio 桥（M5）：被 Claude Code/Cursor 等以 mcp add 方式拉起，
# 把工具调用转发到正在运行的宠物（127.0.0.1:7788 HTTP 桥）
[[bin]]
name = "pet-mcp"
path = "src/bin/pet-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
